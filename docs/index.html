<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slime Armies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            background: #000011;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: default;
            touch-action: none;
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: auto;
        }
        #mobile-input {
            position: absolute;
            opacity: 0;
            width: 1px;
            height: 1px;
            left: -1000px;
            top: -1000px;
            border: 0;
            padding: 0;
        }
    </style>
    
<script type="module">
import init, * as bindings from '/slime-armies/slime-armies-f55ecaad9f7f944a.js';
const wasm = await init({ module_or_path: '/slime-armies/slime-armies-f55ecaad9f7f944a_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<link rel="modulepreload" href="/slime-armies/slime-armies-f55ecaad9f7f944a.js" crossorigin="anonymous" integrity="sha384-dKMyJQ73040hzbBDUdDx2XvrJPpK/tWfWbwoD7aZGOzSbFO02hB4+DRKp/o00axf"><link rel="preload" href="/slime-armies/slime-armies-f55ecaad9f7f944a_bg.wasm" crossorigin="anonymous" integrity="sha384-zxomUagnwbykNk57FwbhDthMlDViB8ddyh1T+ZTHi72AMCi0erMt/bnDyudocgrG" as="fetch" type="application/wasm"></head>
<body>
    <canvas id="canvas" tabindex="0"></canvas>
    <input id="mobile-input" type="text" tabindex="-1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" />
    <script type="module">
        // Debug helpers will be exposed by Trunk-generated script
        // Access via window.slime and window.slimeDebug after TrunkApplicationStarted event
        addEventListener("TrunkApplicationStarted", (e) => {
            const bindings = e.detail.wasm;
            window.slime = bindings;
            window.slimeDebug = {
                send: (cmd) => bindings.send_debug_command(cmd),
                help: () => bindings.send_debug_command("help"),
            };
        });
    </script>
</body>
</html>
