<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slime Armies</title>
    <style>
        * {
            margin: 0;

            background: #000011;
            width: 100%;
            height: 100%;
            overflow: hidden;

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: default;
        }
    </style>
    
<script type="module">
import init, * as bindings from '/slime-armies/slime-armies-ae43c62c51132bf5.js';
const wasm = await init({ module_or_path: '/slime-armies/slime-armies-ae43c62c51132bf5_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
<link rel="modulepreload" href="/slime-armies/slime-armies-ae43c62c51132bf5.js" crossorigin="anonymous" integrity="sha384-/I4zvzDaUQnAwFl1z68FCYUFSwQ9NBitm3KQFpG+WxnqmcDWCkg5J/B4L6NWJt3i"><link rel="preload" href="/slime-armies/slime-armies-ae43c62c51132bf5_bg.wasm" crossorigin="anonymous" integrity="sha384-0avPeOOs5x5wDE2kLQHcC9V1II7uZjm+lqRIqsBP6TXnw/Q9Phj4Eha3h88YFsTt" as="fetch" type="application/wasm"></head>
<body>
    <canvas id="canvas"></canvas>
    <script type="module">
        // Debug helpers will be exposed by Trunk-generated script
        // Access via window.slime and window.slimeDebug after TrunkApplicationStarted event
        addEventListener("TrunkApplicationStarted", (e) => {
            const bindings = e.detail.wasm;
            window.slime = bindings;
            window.slimeDebug = {
                send: (cmd) => bindings.send_debug_command(cmd),
                help: () => bindings.send_debug_command("help"),
            };
        });
    </script>
</body>
